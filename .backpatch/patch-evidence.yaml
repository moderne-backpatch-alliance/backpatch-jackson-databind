  - cve: CVE-2026-54514
    upstream_fix_url: https://github.com/advisories/GHSA-hgj6-7826-r7m5
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-54514
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-jackson-databind/compare/3f13f16~1...ae0bc69
    basis: adapted
    artifacts:
      - com.fasterxml.jackson.core:jackson-databind
    note: "Carried from 2.9.10.8.1-backpatch-00005; ported onto 2.9.10.8; fixed at 2.9.10.8.1-backpatch-00005 (backpatch-jackson-databind@3f13f16..ae0bc69). jackson-databind no longer looks up the host when it deserializes an `InetSocketAddress` (CVE-2026-54514), so every value comes back unresolved, `\"127.0.0.1:8080\"` included. If your app reads socket addresses from JSON and connects with them or calls `getAddress()`, the connect now throws `UnknownHostException` and `getAddress()` returns null. Resolve the address yourself where you use it: `new InetSocketAddress(addr.getHostString(), addr.getPort())` does the lookup at that point."
