  - cve: CVE-2026-59889
    upstream_fix_url: https://github.com/FasterXML/jackson-databind/commit/d627a8a86fcb062429282f79f3f256f181ed2c7b
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-59889
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-jackson-databind/commit/8c8847d
