    note: Carried from 2.9.10.8.1-backpatch-00007; ported onto 2.9.10.8; fixed at 2.9.10.8.1-backpatch-00007 (backpatch-jackson-databind@8c8847d).
  - cve: CVE-2026-77310
    upstream_fix_url: https://github.com/advisories/GHSA-vvgp-rfg2-7rr6
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-77310
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-jackson-databind/compare/5448203~1...dfb0b98
    basis: adapted
    artifacts:
      - com.fasterxml.jackson.core:jackson-databind
    note: "New in this release; ported onto 2.9.10.8; fixed at 2.9.10.8.1-backpatch-00008 (backpatch-jackson-databind@5448203..dfb0b98). jackson-databind now deserializes an `InetAddress` only from an IPv4 or IPv6 address literal and no longer looks up host names (CVE-2026-77310). If your app reads `InetAddress` values that hold a host name, `localhost` included, deserialization fails with `InvalidFormatException` (\"Not a valid IP address string literal\"), which also hits values Jackson wrote itself: an address that carries a name, such as `InetAddress.getLoopbackAddress()`, is written as `\"localhost\"`. Write IP literals instead, or hold the value as a `String` and call `InetAddress.getByName()` where you use it; `@JsonFormat(shape = JsonFormat.Shape.NUMBER)`, or the same format through `configOverride(InetAddress.class)`, makes Jackson write the numeric form. A `DeserializationProblemHandler` whose `handleWeirdStringValue` returns `InetAddress.getByName(value)` restores the lookup, which brings back the exposure the fix closes for untrusted input."
